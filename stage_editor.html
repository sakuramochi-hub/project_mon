<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#111a2d">
<title>空中 - ステージエディタ</title>
<style>
:root{
 --bg:#10192b;--panel:#1b2943;--panel2:#293a5d;--line:#435a80;--text:#f1f5ff;--muted:#aebfdf;
 --accent:#f4cf69;--accent-soft:#55492b;--danger:#a65c68;--toolbar-h:42px;--tool-size:54px;
}
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;min-height:100%;overflow:hidden;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",sans-serif;overscroll-behavior:none}
.layout{height:100vh;height:100dvh;height:var(--app-height,100vh)}
button,.filelabel,select,input{font:inherit}
button,.filelabel,select{background:var(--panel2);border:1px solid var(--line);color:var(--text);border-radius:10px;cursor:pointer; -webkit-tap-highlight-color:transparent}
button{display:inline-flex;align-items:center;justify-content:center;gap:7px;min-height:38px;padding:7px 11px;touch-action:manipulation}
button:hover,.filelabel:hover{background:#3a5079}
button:active{transform:translateY(1px)}
button.primary{background:#80652d;border-color:#d9b85b;color:#fff}
button.danger{border-color:var(--danger);color:#ffd9df}
button:disabled{opacity:.38;cursor:default}
select{padding:7px 9px;min-height:36px}
.icon-btn{width:40px;height:40px;padding:0;font-size:19px;border-radius:11px}
.icon-btn.primary{background:#80652d}
.layout{height:100vh;height:100dvh;height:var(--app-height,100vh);display:grid;grid-template-columns:minmax(0,1fr) 250px;gap:9px;padding:9px;max-width:1800px;margin:0 auto;min-height:0}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:13px;padding:10px;min-width:0;min-height:0}
.panel h2{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:2px 0 3px;text-align:center}
.tool-strip{display:flex;align-items:center;gap:3px;flex:1 1 auto;width:auto;min-width:80px;max-width:none;overflow-x:auto;overflow-y:hidden;scrollbar-width:none;overscroll-behavior-x:contain;padding:0 3px;cursor:grab;user-select:none;-webkit-user-select:none;touch-action:pan-y;}
.tool-strip.drag-scrolling{cursor:grabbing;}
.tool-strip::-webkit-scrollbar{display:none}
.tool{width:34px;height:34px;min-height:34px;flex:none;padding:0;border-radius:8px;gap:0;font-size:17px;color:#eaf0ff;background:#243653;border-color:#3f567b}
.tool-icon{font-size:18px;line-height:1;display:block}
.tool.active{outline:2px solid var(--accent);outline-offset:-2px;background:#4a493c;border-color:#b89a4e;box-shadow:0 0 0 1px #b89a4e inset}
.workspace{display:grid;grid-template-rows:42px minmax(0,1fr) 30px;gap:7px;min-width:0;min-height:0}
.workspace-toolbar{display:flex;align-items:center;gap:5px;min-width:0;flex-wrap:nowrap;overflow-x:auto;overflow-y:hidden;scrollbar-width:none;overscroll-behavior-x:contain}
.workspace-toolbar::-webkit-scrollbar{display:none}
.workspace-toolbar>*{flex:none}
.workspace-toolbar>#tools{flex:1 1 auto;width:auto;min-width:80px;max-width:none}
.workspace-toolbar .icon-btn{width:36px;height:34px;min-height:34px;font-size:17px;border-radius:9px;flex:none}
.toolbar-group{display:flex;align-items:center;gap:4px;flex:none}
.history-group{padding-right:5px;border-right:1px solid #435a80}
.view-controls{gap:4px}
.utility-actions{gap:3px;padding-left:6px;border-left:1px solid #435a80}
.zoom-select{font-size:12px;min-width:76px}
.grid-toggle{height:36px;width:38px;border:1px solid var(--line);border-radius:9px;display:grid;place-items:center;background:var(--panel2);cursor:pointer;position:relative;font-size:18px}
.grid-toggle input{position:absolute;opacity:0;width:1px;height:1px}
.grid-toggle:has(input:not(:checked)){opacity:.5}
.canvas-wrap{background:#091321;border:1px solid #3c5277;border-radius:13px;padding:8px;overflow:hidden;min-height:0;display:flex;align-items:flex-start;justify-content:flex-start;position:relative;touch-action:none;}
.canvas-wrap.test-mode{padding:0;align-items:center;justify-content:center;background:#08111f}
.canvas-wrap.test-mode canvas{margin:0!important;cursor:default;border-radius:6px}
canvas{display:block;max-width:none;image-rendering:pixelated;border-radius:6px;touch-action:none;cursor:crosshair;flex:none}
#editorDom{display:block;position:relative;max-width:none;flex:none;overflow:hidden;border-radius:6px;background:linear-gradient(180deg,#78b9df 0%,#b7d9e8 68%,#f0d2b2 100%);touch-action:none;user-select:none;-webkit-user-select:none;isolation:isolate}
#editorBootMessage{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:#17324a;font-size:14px;font-weight:700;text-shadow:0 1px 0 #ffffff88;pointer-events:none}
.editor-world{position:absolute;left:0;top:0;transform-origin:0 0;pointer-events:none}
.editor-shape{position:absolute;box-sizing:border-box;pointer-events:none}
.canvas-wrap:not(.test-mode) canvas{display:none}
.canvas-wrap:not(.test-mode) #editorDom{display:block}
.canvas-wrap.test-mode canvas{display:block}
.canvas-wrap.test-mode #editorDom{display:none}
#notice{height:30px;min-width:0;display:flex;align-items:center;gap:8px;color:#f4d77f;font-size:11px;line-height:1.2;padding:0 4px;overflow:hidden}
#notice:before{content:"●";font-size:8px;color:#7fd3a3;flex:none}
.status-right{margin-left:auto;display:flex;align-items:center;gap:6px;flex:none}
.status-right .small{white-space:nowrap}
#testBtn,#stopTestBtn{min-height:28px;height:28px;padding:3px 10px;font-size:11px;border-radius:8px;white-space:nowrap}
#stopTestBtn{background:#b93648;border-color:#f07886;color:#fff;box-shadow:0 0 0 1px #7f2634 inset}
#stopTestBtn:hover{background:#d1495b;border-color:#ff9aa4}
#stopTestBtn:active{background:#982b3c}
.right{display:flex;flex-direction:column;gap:12px;overflow:auto}
.layout.inspector-collapsed{grid-template-columns:minmax(0,1fr) 0}
.layout.inspector-collapsed .right{display:none}
.right h2{text-align:left;font-size:12px;margin:0 0 7px}
.stat{background:#142139;border:1px solid #314766;border-radius:9px;padding:9px;margin-top:6px;font-size:12px;line-height:1.65;color:#e2eaff}
.section{padding-top:11px;border-top:1px solid #3a4e70}
.small{font-size:11px;color:var(--muted);line-height:1.55}
input[type=number],input[type=text]{width:100%;background:#101b30;color:#fff;border:1px solid var(--line);border-radius:8px;padding:9px;min-height:38px}
label.field{display:block;font-size:11px;color:var(--muted);margin:10px 0 4px}
.settings-panel{position:fixed;z-index:30;top:calc(var(--toolbar-h) + 8px);left:12px;width:290px;max-height:calc(100vh - var(--toolbar-h) - 24px);max-height:calc(100dvh - var(--toolbar-h) - 24px);overflow:auto;box-shadow:0 14px 46px #0009;display:none}
body.settings-open .settings-panel{display:block}
.settings-panel h2{text-align:left;font-size:13px;margin:0 0 10px;color:var(--text)}
.setting-actions{display:grid;grid-template-columns:1fr;gap:7px;margin-top:9px}
#resizeBtn{width:100%}
#editorHelp{margin-top:14px;padding-top:12px;border-top:1px solid #3a4e70}
#editorHelp p{margin:0}
.hidden{display:none!important}
.sr-only{position:absolute!important;width:1px!important;height:1px!important;padding:0!important;margin:-1px!important;overflow:hidden!important;clip:rect(0,0,0,0)!important;white-space:nowrap!important;border:0!important}
.touch-controls{display:none;position:fixed;z-index:25;left:10px;right:10px;bottom:calc(48px + env(safe-area-inset-bottom));justify-content:space-between;pointer-events:none}
.touch-controls button{pointer-events:auto;width:49px;height:48px;min-height:48px;border-radius:14px;background:#182945eF;border-color:#7188b0;font-size:19px;box-shadow:0 4px 14px #0006}
.touch-controls .move-pad{display:flex;flex-direction:column;gap:5px}
.touch-controls .move-row{display:flex;gap:7px}
.touch-controls .action-pad{display:flex;gap:7px}
body.touch-device .touch-controls:not(.hidden){display:flex}
@media(max-width:1050px) and (min-width:701px){.layout{grid-template-columns:minmax(0,1fr) 215px;gap:7px;padding:7px}.right{padding:9px}}
@media(max-width:700px), (orientation:landscape) and (max-height:520px){
 :root{--toolbar-h:40px}
 .icon-btn{width:36px;height:36px;min-height:36px;border-radius:9px;font-size:17px}
 .layout{height:100dvh;grid-template-columns:minmax(0,1fr);grid-template-rows:minmax(0,1fr);grid-template-areas:"workspace";gap:0;padding:0;max-width:none}
 .workspace{grid-area:workspace;grid-template-rows:40px minmax(0,1fr) 31px;gap:4px;padding:5px 6px 3px}
 .workspace-toolbar{gap:3px}
 .workspace-toolbar .icon-btn{width:31px;height:31px;min-height:31px;font-size:15px}
 .history-group{padding-right:3px;gap:2px}
 .tool-strip{gap:2px;padding:0 2px}
 .tool{width:29px;height:30px;min-height:30px;border-radius:7px}
 .tool-icon{font-size:16px}
 .view-controls{gap:3px}
 .zoom-select{height:34px;min-height:34px;min-width:67px;padding:5px 6px;font-size:11px}
 .grid-toggle{width:34px;height:34px;font-size:16px}
 .canvas-wrap{border-radius:9px;padding:5px;justify-content:flex-start;align-items:center}
 #notice{height:31px;font-size:10px;padding:0 2px;gap:5px}
 #testBtn,#stopTestBtn{height:27px;min-height:27px;padding:2px 7px;font-size:10px}
 .status-right .small{display:none}
 .right{display:none;position:fixed;z-index:35;top:calc(var(--toolbar-h) + 8px);right:8px;bottom:calc(78px + env(safe-area-inset-bottom));left:8px;border-radius:14px;padding:14px;box-shadow:0 18px 50px #000a;background:#1b2943;overflow:auto}
 body.inspector-open .right{display:flex}
 .settings-panel{top:calc(var(--toolbar-h) + 8px);left:8px;right:8px;bottom:calc(78px + env(safe-area-inset-bottom));width:auto;max-height:none;border-radius:14px;padding:14px}
 body.inspector-open .settings-panel{display:none}
 body.settings-open .right{display:none}
 .touch-controls{position:fixed;z-index:25;left:10px;right:10px;bottom:calc(80px + env(safe-area-inset-bottom));display:flex;justify-content:space-between;pointer-events:none}
 .touch-controls button{pointer-events:auto;width:49px;height:48px;min-height:48px;border-radius:14px;background:#182945eF;border-color:#7188b0;font-size:19px;box-shadow:0 4px 14px #0006}
 .touch-controls .move-pad{display:flex;flex-direction:column;gap:5px}.touch-controls .move-row{display:flex;gap:7px}
 .touch-controls .action-pad{display:flex;gap:7px}
}

@media (orientation:landscape) and (max-height:520px){
 :root{--toolbar-h:34px;--tool-size:52px}
 .icon-btn{width:32px;height:32px;min-height:32px;font-size:15px}
 .layout{grid-template-rows:minmax(0,1fr)}
 .workspace{grid-template-rows:34px minmax(0,1fr) 24px;gap:3px;padding:3px 5px 2px}
 .workspace-toolbar .icon-btn{width:29px;height:29px;min-height:29px;font-size:14px}
 .history-group{padding-right:2px;gap:2px}
 .tool-strip{gap:2px;padding:0 1px}
 .tool{width:27px;height:28px;min-height:28px;border-radius:6px}
 .tool-icon{font-size:15px}
 .zoom-select{height:31px;min-height:31px;min-width:62px;font-size:10px}
 .grid-toggle{width:31px;height:31px;font-size:15px}
 .canvas-wrap{padding:4px;border-radius:8px;align-items:flex-start;justify-content:flex-start}
 #notice{height:24px;font-size:9px}
 #testBtn,#stopTestBtn{height:24px;min-height:24px;padding:2px 6px;font-size:9px}
 .right{bottom:calc(65px + env(safe-area-inset-bottom))}
 .settings-panel{bottom:calc(65px + env(safe-area-inset-bottom))}
 .touch-controls{bottom:calc(64px + env(safe-area-inset-bottom))}
 .touch-controls button{width:43px;height:42px;min-height:42px;font-size:17px}
}
@media(max-width:370px){.toolbar-group{gap:2px}.zoom-select{min-width:57px;padding-left:4px;padding-right:4px}.utility-actions{gap:2px;padding-left:4px}}
</style>
</head>
<body>
<main class="layout" id="layoutRoot">
 <section class="workspace">
  <div class="workspace-toolbar">
   <div class="toolbar-group history-group">
    <button id="undoBtn" class="icon-btn" title="元に戻す" aria-label="元に戻す">↶</button>
    <button id="redoBtn" class="icon-btn" title="やり直す" aria-label="やり直す">↷</button>
   </div>
   <div class="tool-strip" id="tools" role="toolbar" aria-label="配置ツール">
   <button class="tool tool-icon-btn active" data-tool="select" title="選択・移動" aria-label="選択・移動"><span class="tool-icon">↖</span><span class="sr-only">選択</span></button>
   <button class="tool tool-icon-btn" data-tool="hand" title="キャンバス移動" aria-label="キャンバス移動"><span class="tool-icon">✋</span><span class="sr-only">移動</span></button>
   <button class="tool tool-icon-btn" data-tool="platform" title="地面・足場" aria-label="地面・足場"><span class="tool-icon">🟩</span><span class="sr-only">足場</span></button>
   <button class="tool tool-icon-btn" data-tool="stone" title="石ブロック" aria-label="石ブロック"><span class="tool-icon">🧱</span><span class="sr-only">石</span></button><button class="tool tool-icon-btn" data-tool="bossWall" title="鉄ブロック" aria-label="鉄ブロック"><span class="tool-icon">▦</span><span class="sr-only">鉄ブロック</span></button>
   <button class="tool tool-icon-btn" data-tool="beetle" title="スライム（味方）" aria-label="スライム"><span class="tool-icon">🟢</span><span class="sr-only">スライム</span></button><button class="tool tool-icon-btn" data-tool="mage" title="魔導士（味方）" aria-label="魔導士"><span class="tool-icon">🧙🏻</span><span class="sr-only">魔導士</span></button><button class="tool tool-icon-btn" data-tool="enemySlime" title="敵スライム" aria-label="敵スライム"><span class="tool-icon">⚫</span><span class="sr-only">敵スライム</span></button><button class="tool tool-icon-btn" data-tool="rabbit" title="ウサギ" aria-label="ウサギ"><span class="tool-icon">🐇</span><span class="sr-only">ウサギ</span></button><button class="tool tool-icon-btn" data-tool="archer" title="アーチャー" aria-label="アーチャー"><span class="tool-icon">🏹</span><span class="sr-only">アーチャー</span></button><button class="tool tool-icon-btn" data-tool="witch" title="ウィッチ" aria-label="ウィッチ"><span class="tool-icon">🧙</span><span class="sr-only">ウィッチ</span></button>
   <button class="tool tool-icon-btn" data-tool="wisp" title="ウィスプ（味方）" aria-label="ウィスプ"><span class="tool-icon">👻</span><span class="sr-only">ウィスプ</span></button><button class="tool tool-icon-btn" data-tool="bat" title="コウモリ" aria-label="コウモリ"><span class="tool-icon">🦇</span><span class="sr-only">コウモリ</span></button><button class="tool tool-icon-btn" data-tool="bird" title="赤い鳥" aria-label="赤い鳥"><span class="tool-icon">🐦</span><span class="sr-only">赤い鳥</span></button><button class="tool tool-icon-btn" data-tool="drone" title="ドローン" aria-label="ドローン"><span class="tool-icon">◇</span><span class="sr-only">ドローン</span></button><button class="tool tool-icon-btn" data-tool="redDrone" title="赤色ドローン" aria-label="赤色ドローン"><span class="tool-icon">🔴</span><span class="sr-only">赤ドローン</span></button><button class="tool tool-icon-btn" data-tool="bigDrone" title="大型ドローン" aria-label="大型ドローン"><span class="tool-icon">💠</span><span class="sr-only">大型ドローン</span></button><button class="tool tool-icon-btn" data-tool="boss" title="ボス：機械要塞" aria-label="ボス：機械要塞"><span class="tool-icon">🏰</span><span class="sr-only">機械要塞ボス</span></button><button class="tool tool-icon-btn" data-tool="armorBoss" title="ボス：アーマー" aria-label="ボス：アーマー"><span class="tool-icon">🦾</span><span class="sr-only">アーマー</span></button><button class="tool tool-icon-btn" data-tool="dragonBoss" title="ボス：ティアマット" aria-label="ボス：ティアマット"><span class="tool-icon">🐉</span><span class="sr-only">ティアマット</span></button><button class="tool tool-icon-btn" data-tool="bossDoor" title="ボス部屋の入口" aria-label="ボス部屋の入口"><span class="tool-icon">🌀</span><span class="sr-only">ボス入口</span></button>
   <button class="tool tool-icon-btn" data-tool="start" title="スタート" aria-label="スタート"><span class="tool-icon">🚩</span><span class="sr-only">開始</span></button>
   <button class="tool tool-icon-btn" data-tool="goal" title="ゴール" aria-label="ゴール"><span class="tool-icon">🚪</span><span class="sr-only">ゴール</span></button>
   <button class="tool tool-icon-btn" data-tool="erase" title="消しゴム" aria-label="消しゴム"><span class="tool-icon">⌫</span><span class="sr-only">削除</span></button>
  
   </div>
   <div class="toolbar-group view-controls">
    <label class="grid-toggle" title="グリッド表示" aria-label="グリッド表示">▦<input id="gridToggle" type="checkbox" checked></label>
    <select id="zoom" class="zoom-select" aria-label="表示倍率"><option value="auto">自動</option><option value="1">100%</option><option value="0.8">80%</option><option value="0.6">60%</option></select>
    <button id="testBtn" class="icon-btn primary" title="テストプレイ" aria-label="テストプレイ">▶</button>
    <button id="stopTestBtn" class="icon-btn hidden" title="編集に戻る" aria-label="編集に戻る">■</button>
   </div>
   <div class="toolbar-group utility-actions" aria-label="ステージ操作">
    <button id="newBtn" class="icon-btn" title="新規ステージ" aria-label="新規ステージ">＋</button>
    <button id="loadTrigger" class="icon-btn" title="JSONを読み込む" aria-label="JSONを読み込む">📂</button>
    <button id="saveBtn" class="icon-btn primary" title="JSONを書き出す" aria-label="JSONを書き出す">💾</button>
    <button id="settingsToggle" class="icon-btn" title="ステージ設定" aria-label="ステージ設定">⚙</button>
    <button id="inspectorToggle" class="icon-btn" title="パーツ情報" aria-label="パーツ情報">▤</button>
   </div>
   <input id="loadFile" type="file" accept=".json,application/json" class="hidden">
  </div>
  <div class="canvas-wrap" id="canvasWrap">
   <canvas id="editor" width="600" height="560" aria-hidden="true"></canvas>
   <div id="editorDom" role="img" aria-label="ステージ編集キャンバス">
    <div id="editorBootMessage">ステージを読み込んでいます…</div>
   </div>
  </div>
  <div id="notice"><span id="noticeText">ツールを選び、パーツを配置してください。</span><div class="status-right"><span class="small">← → / Space / E</span></div></div>
 </section>
 <aside class="panel right" id="inspectorPanel">
  <div>
   <h2>選択中のパーツ</h2>
   <div id="selectionInfo" class="stat">パーツが選択されていません</div>
   <div id="props" class="hidden">
    <label class="field" for="propX">X座標（マス）</label><input type="number" id="propX" min="0">
    <label class="field" for="propY">Y座標（マス）</label><input type="number" id="propY" min="0">
    <label class="field" for="propW">横幅（マス）</label><input type="number" id="propW" min="1">
    <label class="field" for="propH">高さ（マス）</label><input type="number" id="propH" min="1">
    <button id="applyProps" style="width:100%;margin-top:9px">変更を適用</button>
    <button id="deleteSelected" class="danger" style="width:100%;margin-top:7px">このパーツを削除</button>
   </div>
  </div>
  <div class="section"><h2>ステージ情報</h2><div class="stat" id="stats"></div>
   <p class="small">敵に憑依して能力を使います。スライムは約8マス高くジャンプし、ウィスプは石を通過して中を自由に飛べます。</p>
  </div>
 </aside>
</main>
<aside class="panel settings-panel" id="settingsPanel">
 <h2>ステージ設定</h2>
 <label class="field" for="stageName">ステージ名</label><input id="stageName" type="text" value="空中" maxlength="40">
 <label class="field" for="worldWidth">横幅（マス）</label><input id="worldWidth" type="number" min="30" max="150" value="150">
 <div class="setting-actions"><button id="resizeBtn">横幅を適用</button></div>
 <div id="editorHelp"><h2>編集のヒント</h2><p class="small">足場・ブロック・敵を選んでタップすると配置。選択ツールでパーツをドラッグして移動。空白部分をドラッグすると画面をスクロールできます。スタートとゴールは各1つです。</p></div>
</aside>
<div class="touch-controls hidden" id="touchControls" aria-label="テストプレイ操作">
 <div class="move-pad"><div class="move-row"><button data-key="ArrowLeft" aria-label="左">◀</button><button data-key="ArrowRight" aria-label="右">▶</button></div><div class="move-row"><button data-key="ArrowUp" aria-label="上">▲</button><button data-key="ArrowDown" aria-label="下">▼</button></div></div>
 <div class="action-pad"><button data-key="KeyE" aria-label="憑依">E</button><button data-key="Space" aria-label="向き固定／ジャンプ">⤒</button></div>
</div>
<script>
(()=>{
const cv=document.getElementById('editor'),wrap=document.getElementById('canvasWrap'),editorDom=document.getElementById('editorDom'),CELL=40,ROWS=14;
let ctx=null,editorBooted=false;
let editorViewportWidth=600;
const $=id=>document.getElementById(id);

const INPUT_CODE_BY_KEY={ArrowLeft:'ArrowLeft',ArrowRight:'ArrowRight',ArrowUp:'ArrowUp',ArrowDown:'ArrowDown',' ':'Space',Space:'Space',e:'KeyE',E:'KeyE'};
function setInputState(e,pressed){const code=INPUT_CODE_BY_KEY[e.key]||e.code;if(['ArrowLeft','ArrowRight','ArrowUp','ArrowDown','Space'].includes(code))e.preventDefault();if(pressed){if(!keys[code]&&test&&code==='KeyE')possessGame();if(!keys[code]&&test&&code==='Space'&&gamePlayer){if(gamePlayer.form==='mage')mageRepel();else gamePlayer.jumpBuffer=8;}keys[code]=true;}else keys[code]=false;}
document.addEventListener('keydown',e=>setInputState(e,true),{capture:true});
document.addEventListener('keyup',e=>setInputState(e,false),{capture:true});
window.addEventListener('blur',()=>{keys={};});
function pressTestKey(key){if(key==='KeyE'){possessGame();return;}if(key==='Space'&&!keys[key]&&gamePlayer){if(gamePlayer.form==='mage')mageRepel();else gamePlayer.jumpBuffer=8;}keys[key]=true;}
document.querySelectorAll('.touch-controls button').forEach(btn=>{

 btn.addEventListener('pointerdown',down);btn.addEventListener('pointerup',up);btn.addEventListener('pointerleave',up);btn.addEventListener('pointercancel',up);
});
